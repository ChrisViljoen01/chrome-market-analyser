name: Ingest market snapshot

on:
  repository_dispatch:
    types:
      - market_snapshot
  workflow_dispatch:
    inputs:
      snapshot_base64:
        description: "Base64-encoded complete market-snapshot.json payload for validation or ingestion"
        required: true
        type: string
      dry_run:
        description: "Validate only; do not commit"
        required: true
        default: true
        type: boolean

permissions:
  actions: write
  contents: write

concurrency:
  group: market-snapshot-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate and apply dispatched snapshot
        run: node scripts/apply-market-snapshot-dispatch.mjs
        env:
          MARKET_SNAPSHOT_BASE64: ${{ inputs.snapshot_base64 }}
          DRY_RUN: ${{ inputs.dry_run }}

      - name: Commit updated market snapshot
        id: commit
        if: github.event_name == 'repository_dispatch' || inputs.dry_run == false
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/market-snapshot.json
          if git diff --cached --quiet; then
            echo "No market snapshot changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update market snapshot from approved intake"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy updated market snapshot
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy-pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
