trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: AzureStaticWebApp@0
    displayName: Build and deploy Chrome Market Analyser
    inputs:
      app_location: /
      api_location: api
      output_location: azure-dist
      app_build_command: pnpm build:azure
      azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN)
